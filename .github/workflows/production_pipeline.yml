name: NutriScan Enterprise Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_ENGINE: "auto"

jobs:
  # ============================================================================
  # Stage 1: Code Quality, Linting & Type Validation
  # ============================================================================
  stage-1-lint-and-quality:
    name: "Stage 1: Lint, Code Style & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Backend Python Code
        run: |
          # Enforce zero syntax errors or undefined symbols
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce formatting and style
          flake8 backend tests --count --exit-zero --max-complexity=18 --max-line-length=130 --statistics

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: |
          npm ci --prefer-offline --no-audit
          npx tsc -b

  # ============================================================================
  # Stage 2: Unit & Clinical Safety Validation
  # ============================================================================
  stage-2-unit-and-clinical:
    name: "Stage 2: Unit & Clinical Safety Tests"
    runs-on: ubuntu-latest
    needs: stage-1-lint-and-quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Execute Clinical & Unit Test Suites
        env:
          PYTHONPATH: "backend:."
          ENVIRONMENT: "development"
        run: |
          python -m pytest backend/test_pediatric_safety.py backend/test_clinical_validation_framework.py tests/test_phase10c_inference.py -v

  # ============================================================================
  # Stage 3: Integration & Distributed Infrastructure (Postgres & Redis)
  # ============================================================================
  stage-3-integration-tests:
    name: "Stage 3: Database & Redis Integration Tests"
    runs-on: ubuntu-latest
    needs: stage-1-lint-and-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutriscan_admin
          POSTGRES_PASSWORD: nutriscan_secure_pass_2026
          POSTGRES_DB: nutriscan_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx psycopg2-binary redis

      - name: Execute Dual-Engine Database & Redis Integration Tests
        env:
          PYTHONPATH: "backend:."
          DATABASE_URL: "postgresql+asyncpg://nutriscan_admin:nutriscan_secure_pass_2026@localhost:5432/nutriscan_db"
          DATABASE_ENGINE: "postgresql"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: "development"
        run: |
          python -m pytest backend/test_postgres_persistence_integration.py backend/test_redis_integration.py backend/test_observability_operations.py -v

  # ============================================================================
  # Stage 4: Security SAST & Vulnerability Audits
  # ============================================================================
  stage-4-security-audit:
    name: "Stage 4: Security SAST & Vulnerability Scans"
    runs-on: ubuntu-latest
    needs: stage-1-lint-and-quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app -ll -ii -f screen

      - name: Secret Leak Prevention Verification
        run: |
          # Verify zero raw unencrypted production keys in tracked files
          ! grep -rn "BEGIN RSA PRIVATE KEY" backend/ frontend/ || exit 1

  # ============================================================================
  # Stage 5: Container Build & Verification
  # ============================================================================
  stage-5-container-build:
    name: "Stage 5: Docker Container Builds & Verification"
    runs-on: ubuntu-latest
    needs: [stage-2-unit-and-clinical, stage-3-integration-tests, stage-4-security-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: nutriscan-backend:production-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nutriscan-frontend:production-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 6: Deployment Gate & Release Readiness Certification
  # ============================================================================
  stage-6-deployment-gate:
    name: "Stage 6: Deployment Gate & Certification"
    runs-on: ubuntu-latest
    needs: [stage-5-container-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Certification Output
        run: |
          echo "================================================================"
          echo "NutriScan AI Healthcare Platform — CI/CD Production Gate"
          echo "Status: PASSED"
          echo "All 6 verification stages completed successfully:"
          echo "✓ Linting & Static Code Analysis"
          echo "✓ Clinical Validation & Safety Framework"
          echo "✓ PostgreSQL & Redis Integration"
          echo "✓ Security & SAST Vulnerability Audit"
          echo "✓ Multi-Stage Docker Container Verification"
          echo "✓ Deployment Certification"
          echo "================================================================"
