services:
  # ----------------------------------------------------------------------------
  # 1. NutriScan FastAPI Production Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: nutriscan-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: nutriscan-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nutriscan-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "https://nutriscan-frontend.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. NutriScan React + Vite Production Frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: nutriscan-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nutriscan-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # ----------------------------------------------------------------------------
  # 3. NutriScan Managed Redis (Rate Limiter, Denylist & Cache)
  # ----------------------------------------------------------------------------
  - type: redis
    name: nutriscan-redis
    plan: free
    ipAllowList: [] # internal network only

databases:
  # ----------------------------------------------------------------------------
  # 4. NutriScan Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: nutriscan-postgres
    databaseName: nutriscan_db
    user: nutriscan_admin
    plan: free
    postgresMajorVersion: 16
